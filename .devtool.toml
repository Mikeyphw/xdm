[project]
# This is a mixed desktop/.NET and Android repository. Android is the root
# project kind; desktop commands select the xdm_modern named target explicitly.
runner = "android" # auto | dotnet | android | gradle | python | command | unknown
platform = "android"

[execution]
environment = "auto" # auto | native-termux | chroot | desktop-linux | android-device | external-device
chroot_name = "androidos"
device_serial = ""

[targets.xdm_modern]
solution = "app/XDM/XDM.Modern.sln"
run_project = "app/XDM/src/XDM.App/XDM.App.csproj"

restore_command = "dotnet restore app/XDM/XDM.Modern.sln"
build_command = "dotnet build app/XDM/XDM.Modern.sln --configuration Release --no-restore"
test_command = "dotnet test app/XDM/XDM.Modern.sln --configuration Release --no-build"
run_command = "dotnet run --project app/XDM/src/XDM.App/XDM.App.csproj"


# REM18 package work is decomposed into EXO-visible jobs. The final-seal script
# retains its standalone all-in-one behavior, while Devtool package execution
# invokes one component per workflow node.
inputs = [
    ".devtool.toml",
    "app/XDM/**",
    "docs/**",
]
outputs = [
    "artifacts/rem18-final-seal/**",
]
runner = "dotnet"
platform = "desktop"
[jobs.xdm-rem18-prepare-evidence]
runner = "command"
root = "."
command = ["mkdir", "-p", "artifacts/rem18-final-seal"]
outputs = ["artifacts/rem18-final-seal/**"]
inputs = [
    "app/XDM/eng/**",
    ".devtool.toml",
]

[jobs.xdm-rem18-firefox-audit]
runner = "python"
root = "."
shell_command = "python3 app/XDM/eng/validate-xfe01-single-firefox-extension.py 2>&1 | tee artifacts/rem18-final-seal/single-firefox-extension-audit.log"
outputs = ["artifacts/rem18-final-seal/single-firefox-extension-audit.log"]
inputs = [
    "app/XDM/eng/validate-xfe01-single-firefox-extension.py",
    "app/XDM/**",
]

[jobs.xdm-rem18-ledger-audit]
runner = "python"
root = "."
command = ["python3", "app/XDM/eng/rem18-ledger-audit.py", "--write-evidence", "artifacts/rem18-final-seal/ledger-audit.json"]
outputs = ["artifacts/rem18-final-seal/ledger-audit.json"]
inputs = [
    "app/XDM/eng/rem18-ledger-audit.py",
    "app/XDM/**",
]

[jobs.xdm-rem18-release-matrix-audit]
runner = "python"
root = "."
command = ["python3", "app/XDM/eng/rem18-release-matrix-audit.py", "--write-evidence", "artifacts/rem18-final-seal/release-matrix-audit.json"]
outputs = ["artifacts/rem18-final-seal/release-matrix-audit.json"]
inputs = [
    "app/XDM/eng/rem18-release-matrix-audit.py",
    "app/XDM/**",
]

[jobs.xdm-rem18-package-matrix]
runner = "command"
root = "."
command = ["bash", "app/XDM/eng/rem18-final-release-seal.sh", "--devtool-package-matrix-only"]
outputs = [
  "artifacts/rem18-final-seal/linux-package-matrix.log",
  "artifacts/rem18-final-seal/non-linux-package-note.log",
  "artifacts/rem18-final-seal/dotnet-validation-deferred.json",
]
inputs = [
    "app/XDM/eng/rem18-final-release-seal.sh",
    "app/XDM/**",
]

[jobs.xdm-rem18-linux-x64-smoke]
runner = "command"
root = "."
command = ["bash", "app/XDM/eng/rem18-final-release-seal.sh", "--devtool-linux-x64-smoke-only"]
outputs = ["artifacts/rem18-final-seal/linux-x64-smoke.log"]
inputs = [
    "app/XDM/eng/rem18-final-release-seal.sh",
    "artifacts/rem18-final-seal/**",
]

[jobs.xdm-rem18-linux-arm64-smoke]
runner = "command"
root = "."
command = ["bash", "app/XDM/eng/rem18-final-release-seal.sh", "--devtool-linux-arm64-smoke-only"]
outputs = ["artifacts/rem18-final-seal/linux-arm64-structural-smoke.log"]
inputs = [
    "app/XDM/eng/rem18-final-release-seal.sh",
    "artifacts/rem18-final-seal/**",
]

[jobs.xdm-rem18-powershell-static]
runner = "command"
root = "."
command = ["bash", "app/XDM/eng/rem18-final-release-seal.sh", "--devtool-powershell-static-only"]
outputs = ["artifacts/rem18-final-seal/rem18-powershell-static.log"]
inputs = [
    "app/XDM/eng/rem18-final-release-seal.sh",
    "app/XDM/**",
]

[jobs.xdm-rem18-finalize]
runner = "command"
root = "."
command = ["bash", "app/XDM/eng/rem18-final-release-seal.sh", "--devtool-finalize-only"]
outputs = [
  "artifacts/rem18-final-seal/final-seal-summary.json",
  "artifacts/rem18-final-seal/rem18-final-seal-evidence.tar.gz",
]
inputs = [
    "app/XDM/eng/rem18-final-release-seal.sh",
    "artifacts/rem18-final-seal/**",
]

[targets.xdm_modern.workflows]
package = [
    {id = "prepare", ref = "job:xdm-rem18-prepare-evidence", depends_on = []},
    {id = "firefox", ref = "job:xdm-rem18-firefox-audit", depends_on = ["prepare"]},
    {id = "ledger", ref = "job:xdm-rem18-ledger-audit", depends_on = ["prepare"]},
    {id = "release_matrix", ref = "job:xdm-rem18-release-matrix-audit", depends_on = ["prepare"]},
    {id = "powershell_static", ref = "job:xdm-rem18-powershell-static", depends_on = ["prepare"]},
    {id = "package_matrix", ref = "job:xdm-rem18-package-matrix", depends_on = ["firefox", "ledger", "release_matrix"]},
    {id = "linux_x64_smoke", ref = "job:xdm-rem18-linux-x64-smoke", depends_on = ["package_matrix"]},
    {id = "linux_arm64_smoke", ref = "job:xdm-rem18-linux-arm64-smoke", depends_on = ["package_matrix"]},
    {id = "finalize", ref = "job:xdm-rem18-finalize", depends_on = ["linux_x64_smoke", "linux_arm64_smoke", "powershell_static"]},
]

# REM18 creates final-seal evidence during the package command itself.
# Do not require this artifact after restore/build/test, or Devtool reports
# ARTIFACT_MISSING before the package step has run.
[targets.xdm_modern.artifacts]
required = false
verify = false
paths = ["artifacts/rem18-final-seal/rem18-final-seal-evidence.tar.gz"]

[targets.xdm_android]
root = "app/XDM.Android"
execution_environment = "native-termux"
chroot_name = "androidos"
inputs = [
    ".devtool.toml",
    "app/XDM.Android/**",
]
outputs = [
    "app/XDM.Android/**/build/**",
    "app/XDM.Android/artifacts/**",
]
runner = "android"
platform = "android"

[targets.xdm_android.android]
variant = "debug"
aapt2_provider = "termux"
instrumentation = "when-device-present"
prefer_native_termux = true

[targets.xdm_android.gradle]
version = "9.7.1"
provider = "auto"
max_workers = 1
structured_events = true
no_daemon = true
daemon_idle_timeout_ms = 900000
parallel = false
build_cache = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=false",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.xdm_android.tasks]
restore = ["help"]

build = [
  "clean",
  ":media-ffmpeg:installPinnedFfmpegRuntime",
  ":transfer-aria2:installOfficialAria2Runtime",
  "assembleDebug",
]

test = [
    ":core-model:test",
    ":core-utils:test",
    ":browser-extension:jsTest",
    ":browser-extension:test",
    ":browser-integration:testDebugUnitTest",
    ":media:test",
    ":media-ffmpeg:testDebugUnitTest",
    ":persistence:testDebugUnitTest",
    ":scheduler:testDebugUnitTest",
    ":storage:testDebugUnitTest",
    ":transfer-api:test",
    ":transfer-aria2:test",
    ":transfer-native:testDebugUnitTest",
    ":app:testDebugUnitTest",
]

lint = [":app:lintDebug"]
clean = ["clean"]

[targets.xdm_android.artifacts]
required = false
external_verification = "required"
verify = false
paths = [
    "app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk",
    "app/XDM.Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk",
]
recursive = true

[validation.phases]
preflight = [
  "verifyStableToolchainBaseline",
  ":app:verifyXar01BuildProvenance",
  ":app:verifyXar15PrivacySecurityPerformance",
  ":app:verifyXar16ReleaseEvidenceSeal",
  ":app:verifyGradleTaskGraphOptimization",
  ":app:verifyFfmpeg04FullReleaseSeal",
  ":app:verifyFfmpegRoadmapPostSealHotfix",
  ":app:finalRemediationStaticGate",
  ":browser-extension:validateFirefoxExtension",
  ":app:checkBrowserIntegration",
  ":media-ffmpeg:verifyFfmpegRuntime",
]

dependencies = [
  "dependencies",
]

compile = [
  ":app:compileDebugSources",
]

resources = [
  ":app:processDebugResources",
]

unit-test = [
    ":core-model:test",
    ":core-utils:test",
    ":browser-extension:jsTest",
    ":browser-extension:test",
    ":browser-integration:testDebugUnitTest",
    ":media:test",
    ":media-ffmpeg:testDebugUnitTest",
    ":persistence:testDebugUnitTest",
    ":scheduler:testDebugUnitTest",
    ":storage:testDebugUnitTest",
    ":transfer-api:test",
    ":transfer-aria2:test",
    ":transfer-native:testDebugUnitTest",
    ":app:testDebugUnitTest",
]

package = [
  ":app:assembleDebugAndroidTest",
  ":app:verifyFfmpegDebugApkRuntime",
]

lint = [
  ":app:lintDebug",
]

[env]
KOTLIN_DAEMON_JVMARGS = "-Xmx512m -XX:MaxMetaspaceSize=256m"
GRADLE_OPTS = "-Xmx256m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
TZ = ""

[validation]
android_safe = false

max_workers = 2
cpu_limit = 2

split_gradle = true
parallel = false

no_daemon = false
stop_daemon_after_phase = true
low_priority = true

gradle_heap_mb = 1024
gradle_metaspace_mb = 512
memory_guard_mb = 384

[validation.phase_profiles.compile]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 384
no_daemon = true
low_priority = true

[validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 640
memory_guard_mb = 256
no_daemon = true
low_priority = true


[validation.phase_profiles.dependencies]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 640
memory_guard_mb = 256
no_daemon = true
low_priority = true


[validation.phase_profiles.resources]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 384
no_daemon = true
low_priority = true


[validation.phase_profiles.unit-test]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 384
no_daemon = true
low_priority = true


[validation.phase_profiles.package]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1280
gradle_metaspace_mb = 512
memory_guard_mb = 384
no_daemon = true
low_priority = true


[validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 384
no_daemon = true
low_priority = true


[workspace]
default_target = "xdm_android"

[workspace.groups]
desktop = ["xdm_modern"]
android = ["xdm_android"]
release = ["xdm_modern"]
all = ["@desktop", "@android"]
xgo = ["xgo_foundation", "xgo_store", "xgo_security", "xgo_transfer", "xgo_backends", "xgo_scheduler", "xgo_media", "xgo_ops", "xgo_android", "xgo_desktop", "xgo_seal"]
xgo_gates = ["xgo_gate_spec", "xgo_gate_foundation", "xgo_gate_durable", "xgo_gate_security", "xgo_gate_transfer", "xgo_gate_backends", "xgo_gate_scheduler", "xgo_gate_media_identity", "xgo_gate_media_exec", "xgo_gate_ops", "xgo_gate_android", "xgo_gate_cross_host", "xgo_gate_final"]

# XGO-04 promotes the foundation target to Devtool's native Go runner. The
# repository root owns go.work while the engine module remains under engine/;
# target-local specification jobs therefore retain repository-relative paths.
[targets.xgo_foundation]
runner = "go"
platform = "shared"
root = "."
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.work",
  "engine/**",
  "tools/xgo/**",
  "docs/xgo/**",
]
outputs = [
  ".devtool/build/go/**",
  ".devtool/reports/xgo/foundation/**",
]

[targets.xgo_foundation.go]
packages = ["./..."]
build_targets = ["./engine/cmd/xgo-smoke", "./engine/cmd/xgo-runtime-audit"]
vet = true

[targets.xgo_foundation.jobs.foundation_tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tools/xgo/tests", "-p", "test_*.py"]
inputs = [
  "tools/xgo/**",
]
metadata = { read_only = true }

[targets.xgo_foundation.jobs.donor_audit]
runner = "command"
command = [
  "python3",
  "tools/xgo/audit_foundation.py",
  "donor",
  "--map",
  "engine/docs/donor-map.yaml",
  "--output",
  ".devtool/reports/xgo/foundation/donor-audit.json",
]
inputs = [
  "tools/xgo/audit_foundation.py",
  "engine/docs/donor-map.yaml",
]
outputs = [
  ".devtool/reports/xgo/foundation/donor-audit.json",
]

[targets.xgo_foundation.jobs.capability_ledger_audit]
runner = "command"
command = [
  "python3",
  "tools/xgo/audit_foundation.py",
  "ledger",
  "--map",
  "engine/docs/donor-map.yaml",
  "--ledger",
  "engine/docs/capability-ledger.yaml",
  "--output",
  ".devtool/reports/xgo/foundation/capability-ledger-audit.json",
]
inputs = [
  "tools/xgo/audit_foundation.py",
  "engine/docs/donor-map.yaml",
  "engine/docs/capability-ledger.yaml",
]
outputs = [
  ".devtool/reports/xgo/foundation/capability-ledger-audit.json",
]


[targets.xgo_foundation.jobs.fixture_lint]
runner = "command"
command = [
  "python3",
  "tools/xgo/audit_fixtures.py",
  "lint",
  "--ledger",
  "engine/docs/capability-ledger.yaml",
  "--map",
  "engine/docs/donor-map.yaml",
  "--registry",
  "engine/testdata/fixture-registry.json",
  "--output",
  ".devtool/reports/xgo/foundation/fixture-lint.json",
]
inputs = [
  "tools/xgo/audit_fixtures.py",
  "engine/docs/capability-ledger.yaml",
  "engine/docs/donor-map.yaml",
  "engine/testdata/**",
]
outputs = [
  ".devtool/reports/xgo/foundation/fixture-lint.json",
]

[targets.xgo_foundation.jobs.fixture_secret_scan]
runner = "command"
command = [
  "python3",
  "tools/xgo/audit_fixtures.py",
  "secret-scan",
  "--registry",
  "engine/testdata/fixture-registry.json",
  "--output",
  ".devtool/reports/xgo/foundation/fixture-secret-scan.json",
]
inputs = [
  "tools/xgo/audit_fixtures.py",
  "engine/testdata/**",
]
outputs = [
  ".devtool/reports/xgo/foundation/fixture-secret-scan.json",
]

[targets.xgo_foundation.jobs.devtool_topology_audit]
runner = "command"
command = [
  "python3",
  "tools/xgo/audit_topology.py",
  "audit",
  "--config",
  ".devtool.toml",
  "--output",
  ".devtool/reports/xgo/foundation/devtool-topology.json",
]
inputs = [
  ".devtool.toml",
  "tools/xgo/audit_topology.py",
]
outputs = [
  ".devtool/reports/xgo/foundation/devtool-topology.json",
]

[targets.xgo_foundation.jobs.gofmt_check]
runner = "command"
command = [
  "python3",
  "tools/xgo/check_go_format.py",
  "engine",
  "--output",
  ".devtool/reports/xgo/foundation/gofmt-audit.json",
]
inputs = [
  "engine/**",
  "tools/xgo/check_go_format.py",
]
outputs = [
  ".devtool/reports/xgo/foundation/gofmt-audit.json",
]


[targets.xgo_foundation.jobs.state_machine_contracts]
runner = "command"
command = [
  "go",
  "run",
  "./engine/cmd/xgo-domain-audit",
  "--mode",
  "state-machines",
  "--output",
  ".devtool/reports/xgo/foundation/state-machine-contracts.json",
]
inputs = [
  "go.work",
  "engine/go.mod",
  "engine/domain/**",
  "engine/cmd/xgo-domain-audit/**",
]
outputs = [
  ".devtool/reports/xgo/foundation/state-machine-contracts.json",
]

[targets.xgo_foundation.jobs.failure_mapping_audit]
runner = "command"
command = [
  "go",
  "run",
  "./engine/cmd/xgo-domain-audit",
  "--mode",
  "failure-mapping",
  "--output",
  ".devtool/reports/xgo/foundation/failure-mapping-audit.json",
]
inputs = [
  "go.work",
  "engine/go.mod",
  "engine/domain/failure/**",
  "engine/cmd/xgo-domain-audit/**",
]
outputs = [
  ".devtool/reports/xgo/foundation/failure-mapping-audit.json",
]


[targets.xgo_foundation.jobs.runtime_stress]
runner = "command"
command = [
  "python3",
  "tools/xgo/run_runtime_stress.py",
  "--output",
  ".devtool/reports/xgo/foundation/runtime-stress.json",
]
inputs = [
  "go.work",
  "engine/go.mod",
  "engine/runtime/**",
  "engine/api/v1/**",
  "engine/cmd/xgo-runtime-audit/**",
  "tools/xgo/run_runtime_stress.py",
]
outputs = [
  ".devtool/reports/xgo/foundation/runtime-stress.json",
  ".devtool/reports/xgo/foundation/runtime-stress-audit.json",
]

[targets.xgo_foundation.jobs.platform_broker_matrix]
runner = "command"
command = [
  "go",
  "run",
  "./engine/cmd/xgo-runtime-audit",
  "--mode",
  "platform",
  "--output",
  ".devtool/reports/xgo/foundation/platform-broker-matrix.json",
]
inputs = [
  "go.work",
  "engine/go.mod",
  "engine/runtime/platform/**",
  "engine/cmd/xgo-runtime-audit/**",
]
outputs = [
  ".devtool/reports/xgo/foundation/platform-broker-matrix.json",
]

[targets.xgo_foundation.jobs.abi_harness]
runner = "command"
command = [
  "python3",
  "tools/xgo/run_abi_harness.py",
  "--output",
  ".devtool/reports/xgo/foundation/abi-harness.json",
]
inputs = [
  "go.work",
  "engine/go.mod",
  "engine/runtime/**",
  "engine/api/v1/**",
  "engine/bridge/cabi/**",
  "tools/xgo/run_abi_harness.py",
]
outputs = [
  ".devtool/reports/xgo/foundation/abi-harness.json",
  ".devtool/build/xgo/abi/**",
]

[targets.xgo_foundation.workflows]
validate = [
  { id = "go_validate", ref = "runner:go#validate", depends_on = [] },
  { id = "gofmt_check", ref = "job:gofmt_check", depends_on = ["go_validate"] },
  { id = "state_machine_contracts", ref = "job:state_machine_contracts", depends_on = ["gofmt_check"] },
  { id = "failure_mapping_audit", ref = "job:failure_mapping_audit", depends_on = ["state_machine_contracts"] },
  { id = "runtime_stress", ref = "job:runtime_stress", depends_on = ["failure_mapping_audit"] },
  { id = "platform_broker_matrix", ref = "job:platform_broker_matrix", depends_on = ["runtime_stress"] },
  { id = "abi_harness", ref = "job:abi_harness", depends_on = ["platform_broker_matrix"] },
  { id = "foundation_tests", ref = "job:foundation_tests", depends_on = ["abi_harness"] },
  { id = "donor_audit", ref = "job:donor_audit", depends_on = ["foundation_tests"] },
  { id = "capability_ledger_audit", ref = "job:capability_ledger_audit", depends_on = ["donor_audit"] },
  { id = "fixture_lint", ref = "job:fixture_lint", depends_on = ["capability_ledger_audit"] },
  { id = "fixture_secret_scan", ref = "job:fixture_secret_scan", depends_on = ["fixture_lint"] },
  { id = "devtool_topology_audit", ref = "job:devtool_topology_audit", depends_on = ["fixture_secret_scan"] },
]


# Bootstrap target for future roadmap ownership. The command runner is intentional
# until the target's Go/Android/Desktop-native runner is activated by its first implementation overlay.
[targets.xgo_store]
runner = "go"
platform = "shared"
root = "."
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.work",
  "engine/domain/**",
  "engine/store/**",
  "engine/internal/archtest/**",
  "engine/cmd/xgo-store-audit/**",
  "tools/xgo/run_sqlite_platform_smoke.py",
  "docs/xgo/**",
]
outputs = [
  ".devtool/build/go/**",
  ".devtool/reports/xgo/store/**",
]

[targets.xgo_store.go]
packages = ["./engine/store/...", "./engine/domain/backend", "./engine/internal/archtest"]
build_targets = ["./engine/cmd/xgo-store-audit"]
vet = true

[targets.xgo_store.jobs.sqlite_platform_smoke]
runner = "command"
command = [
  "python3",
  "tools/xgo/run_sqlite_platform_smoke.py",
  "--output",
  ".devtool/reports/xgo/store/sqlite-platform-smoke.json",
]
inputs = [
  "engine/store/sqlite/**",
  "engine/cmd/xgo-store-audit/**",
  "tools/xgo/run_sqlite_platform_smoke.py",
]
outputs = [
  ".devtool/reports/xgo/store/sqlite-platform-smoke.json",
  ".devtool/reports/xgo/store/sqlite-platform-audit.json",
]

[targets.xgo_store.jobs.schema_audit]
runner = "command"
command = [
  "go",
  "run",
  "./engine/cmd/xgo-store-audit",
  "--mode",
  "schema",
  "--output",
  ".devtool/reports/xgo/store/schema-audit.json",
]
inputs = [
  "engine/store/sqlite/schema.go",
  "engine/store/sqlite/schema_test.go",
  "engine/cmd/xgo-store-audit/**",
]
outputs = [
  ".devtool/reports/xgo/store/schema-audit.json",
]

[targets.xgo_store.jobs.cas_stress]
runner = "command"
command = [
  "go",
  "run",
  "./engine/cmd/xgo-store-audit",
  "--mode",
  "cas",
  "--iterations",
  "64",
  "--output",
  ".devtool/reports/xgo/store/cas-stress.json",
]
inputs = [
  "engine/domain/identity/**",
  "engine/store/sqlite/repository.go",
  "engine/store/sqlite/repository_test.go",
  "engine/cmd/xgo-store-audit/**",
]
outputs = [
