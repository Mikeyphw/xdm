name: XDM Android CI

on:
  push:
    paths:
      - 'app/XDM.Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/XDM.Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/XDM.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Static release contracts
        run: |
          python3 tools/validate-bug-hunt-phase10-release-upgrade-packaging.py
          python3 tools/verify-phase10-backup-policy.py
          python3 tools/validate-uix-r6-accessibility-performance-release-seal.py
          python3 tools/validate-bug-hunt-phase11-validation-matrix.py
          bash tools/run-bug-hunt-phase11-validation-matrix.sh --static-only --ci
          bash tools/run-final-release-gate.sh --ci
      - name: Bootstrap wrapper
        run: test -f gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 9.7.0
      - name: Install official ARM64 aria2 runtime
        run: python3 tools/install-aria2-runtime.py --download-official
      - name: Overlay 13 final common validation
        run: bash tools/run-final-common-validation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-debug-artifacts
          path: |
            app/XDM.Android/app/build/outputs/apk/debug/*.apk
            app/XDM.Android/browser-extension/build/outputs/xpi/*.xpi
            app/XDM.Android/browser-extension/build/outputs/xpi/release-artifacts.json
          if-no-files-found: error

  signed-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app/XDM.Android
    env:
      XDM_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
      XDM_RELEASE_STORE_PASSWORD: ${{ secrets.XDM_RELEASE_STORE_PASSWORD }}
      XDM_RELEASE_KEY_ALIAS: ${{ secrets.XDM_RELEASE_KEY_ALIAS }}
      XDM_RELEASE_KEY_PASSWORD: ${{ secrets.XDM_RELEASE_KEY_PASSWORD }}
      XDM_RELEASE_SIGNER_SHA256: ${{ secrets.XDM_RELEASE_SIGNER_SHA256 }}
      XDM_RELEASE_BUILD_ID: ${{ github.sha }}
      XDM_ARIA2_ARCHIVE_SHA256: ${{ secrets.XDM_ARIA2_ARCHIVE_SHA256 }}
      XDM_CAPTURE_KEY_ID: ${{ secrets.XDM_CAPTURE_KEY_ID }}
      XDM_CAPTURE_PUBLIC_KEY_SPKI: ${{ secrets.XDM_CAPTURE_PUBLIC_KEY_SPKI }}
      XDM_CAPTURE_OAEP_HASH: ${{ secrets.XDM_CAPTURE_OAEP_HASH }}
      BUNDLETOOL_JAR: ${{ secrets.BUNDLETOOL_JAR_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore release keystore
        env:
          XDM_RELEASE_KEYSTORE_BASE64: ${{ secrets.XDM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$XDM_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$XDM_RELEASE_KEYSTORE_BASE64" | base64 -d > "$XDM_RELEASE_STORE_FILE"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Install pinned official ARM64 aria2 runtime
        run: |
          test -n "$XDM_ARIA2_ARCHIVE_SHA256"
          python3 tools/install-aria2-runtime.py --download-official --expected-archive-sha256 "$XDM_ARIA2_ARCHIVE_SHA256" --require-trusted-digest
      - name: Require browser capture release key inputs
        run: |
          test -n "$XDM_CAPTURE_KEY_ID"
          test -n "$XDM_CAPTURE_PUBLIC_KEY_SPKI"
          test -n "$XDM_CAPTURE_OAEP_HASH"
      - name: Require bundletool input
        run: test -n "${BUNDLETOOL_JAR:-}" || command -v bundletool
      - name: Signed release gate
        run: bash tools/run-bug-hunt-phase10-release-gate.sh
      - name: Attest Android publication metadata
        uses: actions/attest@v4
        with:
          subject-path: |
            app/XDM.Android/build/release/publication/SHA256SUMS
            app/XDM.Android/build/release/publication/SHA512SUMS
            app/XDM.Android/build/release/publication/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-signed-release
          path: app/XDM.Android/build/release/publication/*
          if-no-files-found: error
