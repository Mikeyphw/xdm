name: XDM Modern CI

on:
  push:
    branches: [master, main, modern]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore modern solution
        run: dotnet restore app/XDM/XDM.Modern.sln
      - name: Build modern solution
        run: dotnet build app/XDM/XDM.Modern.sln -c Release --no-restore -warnaserror
      - name: Test modern solution and final-gate contracts
        run: dotnet test app/XDM/XDM.Modern.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Bootstrap smoke test
        run: dotnet run --project app/XDM/src/XDM.App/XDM.App.csproj -c Release --no-build -- --validate-bootstrap
      - name: REM18 final seal static audit
        if: runner.os == 'Linux'
        run: bash app/XDM/eng/rem18-final-release-seal.sh --static-only
      - name: REM18 final seal static audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/XDM/eng/rem18-final-release-seal.ps1 -StaticOnly
      - name: Linux x64 final-gate package smoke
        if: runner.os == 'Linux'
        run: bash app/XDM/eng/smoke-package.sh linux-x64
      - name: Windows final-gate package smoke matrix
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./app/XDM/eng/smoke-package.ps1 -Runtime win-x64
          ./app/XDM/eng/smoke-package.ps1 -Runtime win-arm64 -PublishOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gate-${{ runner.os }}
          path: |
            artifacts/test-results
            artifacts/smoke
          if-no-files-found: ignore

  native-linux-arm64:
    # Build Go c-shared and run the published .NET app on its real CPU ABI.
    # Never silently substitute an AMD64-only structural publish for ARM64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Linux ARM64 native package and bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          bash app/XDM/eng/smoke-package.sh linux-arm64
          go run ./engine/cmd/xgo-provenance \
            --validate artifacts/smoke/linux-arm64/xdmcore-provenance.json \
            --goos linux --goarch arm64 --build-mode c-shared
          readelf -h artifacts/smoke/linux-arm64/libxdmcore.so | grep -Eq 'Machine:.*AArch64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gate-Linux-arm64
          path: artifacts/smoke/linux-arm64
          if-no-files-found: ignore
